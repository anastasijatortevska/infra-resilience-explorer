[project]
name = "ires"
version = "0.1.0"
description = "Infra Resilience Explorer: MWU-learned tree mixtures for bottleneck analysis"
requires-python = ">=3.11"
dependencies = [
  "networkx>=3.2",
  "numpy>=1.26",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
ires = "ires.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["networkx.*"]
ignore_missing_imports = true
